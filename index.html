<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قارئ باركود من Excel</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js" defer></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Cairo', sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #333;
      color: #f4f4f4;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background-color: #444;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 5px;
    }

    input[type="file"], input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #555;
      border-radius: 4px;
      background-color: #555;
      color: #f4f4f4;
      font-size: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: #555;
      display: none;
    }

    th, td {
      padding: 12px;
      text-align: right;
      border: 1px solid #666;
    }

    th {
      background-color: #009688;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #4a4a4a;
    }

    #file-info {
      margin-bottom: 20px;
      padding: 15px;
      background-color: #4CAF50;
      border-radius: 4px;
      color: white;
      display: none;
    }

    #file-info h3 {
      margin: 0 0 10px 0;
    }

    #file-info p {
      margin: 5px 0;
    }

    /* تحسين الاستجابة للأجهزة المختلفة */
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      .container {
        padding: 15px;
      }
      th, td {
        padding: 8px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="file-info">
      <h3>معلومات الملف المحفوظ</h3>
      <p id="file-name">اسم الملف: <span></span></p>
      <p id="file-date">تاريخ التحميل: <span></span></p>
      <p id="products-count">عدد المنتجات: <span></span></p>
    </div>

    <div class="input-group">
      <label for="excelFile">اختر ملف Excel:</label>
      <input type="file" id="excelFile" accept=".xlsx">
    </div>

    <div class="input-group">
      <label for="searchInput">بحث في كامل الملف:</label>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="searchInput" placeholder="ادخل نص للبحث..." style="flex: 1;">
        <button id="searchButton" style="padding: 10px 20px; background-color: #009688; color: white; border: none; border-radius: 4px; cursor: pointer;">بحث</button>
      </div>
    </div>

    <div id="resultBox" style="margin-top: 20px; padding: 15px; background-color: #555; border-radius: 4px; display: none;"></div>

    <table id="resultTable">
      <thead>
        <tr>
          <th>Parent Item: Name</th>
          <th>Item: Sales Price</th>
          <th>Last Received</th>
          <th>Color</th>
          <th>Quantity On Hand</th>
          <th>After discount</th>
          <th>DIS</th>
        </tr>
      </thead>
      <tbody id="resultBody"></tbody>
    </table>
  </div>

  <footer style="background-color: #f8f9fa; padding: 30px 20px; text-align: center; font-size: 16px; color: #222;">
    <p><strong>Company Name:</strong> Abdulshakour Al-Qarawi Trading Group</p>
    <p><strong>Website Designed by:</strong> Ahmed Salah</p>
    <p><strong>Branches Supervisor:</strong> Mr. Ahmed Abd El-Aaty</p>
  </footer>

  <script defer>
    let productsData = [];
    let isDataLoaded = false;
    const fileInput = document.getElementById('excelFile');
    const searchInput = document.getElementById('searchInput');
    const resultBody = document.getElementById('resultBody');
    const resultTable = document.getElementById('resultTable');
    const fileInfo = document.getElementById('file-info');

    // التحقق من دعم التخزين المحلي
    const storageAvailable = (type) => {
      try {
        const storage = window[type];
        const x = '__storage_test__';
        storage.setItem(x, x);
        storage.removeItem(x);
        return true;
      } catch (e) {
        return false;
      }
    };

    // تحديث معلومات الملف
    const updateFileInfo = (fileName, count) => {
      document.querySelector('#file-name span').textContent = fileName;
      document.querySelector('#file-date span').textContent = new Date().toLocaleString('ar-SA');
      document.querySelector('#products-count span').textContent = count;
      fileInfo.style.display = 'block';
    };

    // حفظ البيانات
    const saveData = (data, fileName) => {
      if (storageAvailable('sessionStorage')) {
        try {
          sessionStorage.setItem('excelData', JSON.stringify(data));
          sessionStorage.setItem('fileName', fileName);
          sessionStorage.setItem('saveDate', new Date().toISOString());
          updateFileInfo(fileName, data.length);
          alert(`تم حفظ ${data.length} منتج بنجاح`);
          isDataLoaded = true;
        } catch (e) {
          alert('خطأ في حفظ البيانات. قد تكون البيانات كبيرة جداً.');
          isDataLoaded = false;
        }
      } else {
        alert('التخزين المحلي غير مدعوم. سيعمل التطبيق في وضع الذاكرة فقط.');
      }
    };

    // استرجاع البيانات
    const loadSavedData = () => {
      if (isDataLoaded) return; // تجنب إعادة تحميل البيانات

      if (storageAvailable('sessionStorage')) {
        const savedData = sessionStorage.getItem('excelData');
        const fileName = sessionStorage.getItem('fileName');
        if (savedData && fileName) {
          productsData = JSON.parse(savedData);
          updateFileInfo(fileName, productsData.length);
          alert(`تم استرجاع ${productsData.length} منتج من التخزين المحلي`);
          isDataLoaded = true;
        }
      }
    };

    // معالجة تحميل ملف Excel
    const processExcelFile = async (file) => {
      if (!file) return;
      
      const workbook = new ExcelJS.Workbook();
      try {
        const reader = new FileReader();
        reader.onload = async function(e) {
          const buffer = e.target.result;
          await workbook.xlsx.load(buffer);
          const worksheet = workbook.worksheets[0];
          productsData = [];
          
          worksheet.eachRow({ includeEmpty: false }, function(row, rowNumber) {
            if (rowNumber > 1) {
              const rowValues = row.values;
              const basePrice = String(rowValues[3] || '').trim();
              let dateReceived = String(rowValues[4] || '').trim();
              let year = 0;
              
              if (dateReceived && !isNaN(new Date(dateReceived))) {
                const dateObj = new Date(dateReceived);
                if (!isNaN(dateObj)) {
                  year = dateObj.getFullYear();
                  dateReceived = dateObj.toISOString().split('T')[0];
                } else {
                  dateReceived = '';
                }
              } else {
                dateReceived = '';
              }

              let discount = '0%';
              if (year >= 2024) {
                discount = '20%';
              } else if (year === 2023) {
                discount = '30%';
              } else if (year <= 2022 && year > 0) {
                discount = '50%';
              }

              const priceWithTax = calculatePriceWithTax(basePrice);
              const discountValue = parseFloat(discount.replace('%', '')) / 100;
              const discountedPrice = priceWithTax * (1 - discountValue);
              
              productsData.push({
                itemName: String(rowValues[2] || '').trim(),
                price: priceWithTax,
                dateReceived: dateReceived,
                color: String(rowValues[5] || '').trim(),
                quantity: String(rowValues[6] || '').trim(),
                priceAfterDiscount: discountedPrice.toFixed(2),
                tax: discount
              });
            }
          });
          saveData(productsData, file.name);
        };
        reader.readAsArrayBuffer(file);
      } catch (error) {
        alert('حدث خطأ في قراءة الملف');
        console.error(error);
        isDataLoaded = false;
      }
    };

    // معالج حدث تغيير الملف
    fileInput.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (file && !isDataLoaded) {
        await processExcelFile(file);
      } else if (isDataLoaded) {
        alert('تم تحميل البيانات بالفعل. قم بتحديث الصفحة لتحميل ملف جديد.');
        fileInput.value = ''; // إعادة تعيين حقل اختيار الملف
      }
    });

    // حساب السعر مع الضريبة
    function calculatePriceWithTax(price) {
      if (!price || isNaN(price)) return '0';
      const numPrice = parseFloat(price);
      return (numPrice * 1.15).toFixed(2);
    }

    // عرض النتائج في الجدول
    function displayResults(results) {
      resultBody.innerHTML = '';
      if (results.length > 0) {
        results.forEach(product => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${product.itemName}</td>
            <td>${product.price}</td>
            <td>${product.dateReceived}</td>
            <td>${product.color}</td>
            <td>${product.quantity}</td>
            <td>${product.priceAfterDiscount}</td>
            <td>${product.tax}</td>
          `;
          resultBody.appendChild(row);
        });
        resultTable.style.display = 'table';
      } else {
        resultTable.style.display = 'none';
      }
    }

    // البحث في المنتجات
    let searchTimeout;
    function searchProducts(query) {
      if (!query) {
        resultTable.style.display = 'none';
        return;
      }
      query = query.toLowerCase().trim();
      
      const results = productsData.filter(product => {
        if (!product) return false;
        
        const itemName = String(product.itemName || '').toLowerCase();
        const color = String(product.color || '').toLowerCase();
        const quantity = String(product.quantity || '').toLowerCase();
        const price = String(product.price || '').toLowerCase();
        const dateReceived = String(product.dateReceived || '');
        
        // البحث الدقيق في كل حقل
        return itemName.includes(query) ||
               color.includes(query) ||
               quantity === query ||
               price === query ||
               dateReceived.includes(query);
      });
      
      displayResults(results);
      
      // إظهار رسالة إذا لم يتم العثور على نتائج
      if (results.length === 0) {
        alert('لم يتم العثور على نتائج للبحث');
      }
    }

    // تحسين وظيفة البحث
    function search() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) {
        document.getElementById('resultBox').innerHTML = '';
        return;
      }
    
      const result = productsData.find(p => 
        (p && (p.itemName === query || p.color === query))
      );
    
      const box = document.getElementById('resultBox');
      if (result) {
        box.innerHTML = `
          ✅ الاسم: ${result.itemName}<br>
          اللون: ${result.color}<br>
          السعر: ${result.price}<br>
          السعر بعد الخصم: ${result.priceAfterDiscount}<br>
          الكمية: ${result.quantity}
        `;
        box.style.display = 'block';
      } else {
        box.innerHTML = '❌ لم يتم العثور على المنتج';
        box.style.display = 'block';
      }
    }

    // إضافة مستمع حدث للزر البحث
    document.getElementById('searchButton').addEventListener('click', search);
    
    // مستمع حدث للبحث أثناء الكتابة
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.trim();
      if (query.length === 0) {
        document.getElementById('resultBox').style.display = 'none';
      } else if (query.length >= 2) {
        document.getElementById('resultBox').style.display = 'block';
        search();
      }
    });
    
    // مستمع حدث للبحث عند الضغط على Enter
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        search();
      }
    });

    // تحميل البيانات تلقائياً عند فتح الموقع
    window.addEventListener('DOMContentLoaded', () => {
      loadExcelFromGitHub();
    });

    // وظيفة تحميل ملف Excel من GitHub
    async function loadExcelFromGitHub() {
      if (isDataLoaded) return;
      
      const excelUrl = 'https://github.com/adfsgtdfshg/barcode-Salah/raw/main/barcode_ready.xlsx';
      
      try {
        // عرض رسالة تحميل
        const loadingMessage = document.createElement('div');
        loadingMessage.id = 'loading-message';
        loadingMessage.style.padding = '15px';
        loadingMessage.style.backgroundColor = '#009688';
        loadingMessage.style.color = 'white';
        loadingMessage.style.borderRadius = '4px';
        loadingMessage.style.marginBottom = '20px';
        loadingMessage.style.textAlign = 'center';
        loadingMessage.innerHTML = 'جاري تحميل البيانات من GitHub...';
        
        document.querySelector('.container').insertBefore(loadingMessage, document.querySelector('.input-group'));
        
        // محاولة تحميل البيانات المحفوظة أولاً
        if (storageAvailable('sessionStorage')) {
          const savedData = sessionStorage.getItem('excelData');
          const fileName = sessionStorage.getItem('fileName');
          if (savedData && fileName) {
            productsData = JSON.parse(savedData);
            updateFileInfo(fileName, productsData.length);
            loadingMessage.innerHTML = `تم استرجاع ${productsData.length} منتج من التخزين المحلي`;
            setTimeout(() => {
              loadingMessage.style.display = 'none';
            }, 3000);
            isDataLoaded = true;
            return;
          }
        }
        
        // تحميل الملف من GitHub
        const response = await fetch(excelUrl);
        if (!response.ok) {
          throw new Error(`فشل تحميل الملف: ${response.status} ${response.statusText}`);
        }
        
        const arrayBuffer = await response.arrayBuffer();
        const workbook = new ExcelJS.Workbook();
        await workbook.xlsx.load(arrayBuffer);
        
        const worksheet = workbook.worksheets[0];
        productsData = [];
        
        worksheet.eachRow({ includeEmpty: false }, function(row, rowNumber) {
          if (rowNumber > 1) {
            const rowValues = row.values;
            const basePrice = String(rowValues[3] || '').trim();
            let dateReceived = String(rowValues[4] || '').trim();
            let year = 0;
            
            if (dateReceived && !isNaN(new Date(dateReceived))) {
              const dateObj = new Date(dateReceived);
              if (!isNaN(dateObj)) {
                year = dateObj.getFullYear();
                dateReceived = dateObj.toISOString().split('T')[0];
              } else {
                dateReceived = '';
              }
            } else {
              dateReceived = '';
            }

            let discount = '0%';
            if (year >= 2024) {
              discount = '20%';
            } else if (year === 2023) {
              discount = '30%';
            } else if (year <= 2022 && year > 0) {
              discount = '50%';
            }

            const priceWithTax = calculatePriceWithTax(basePrice);
            const discountValue = parseFloat(discount.replace('%', '')) / 100;
            const discountedPrice = priceWithTax * (1 - discountValue);
            
            productsData.push({
              itemName: String(rowValues[2] || '').trim(),
              price: priceWithTax,
              dateReceived: dateReceived,
              color: String(rowValues[5] || '').trim(),
              quantity: String(rowValues[6] || '').trim(),
              priceAfterDiscount: discountedPrice.toFixed(2),
              tax: discount
            });
          }
        });
        
        // حفظ البيانات في التخزين المحلي
        if (storageAvailable('sessionStorage')) {
          try {
            sessionStorage.setItem('excelData', JSON.stringify(productsData));
            sessionStorage.setItem('fileName', 'barcode_ready.xlsx');
            sessionStorage.setItem('saveDate', new Date().toISOString());
          } catch (e) {
            console.error('خطأ في حفظ البيانات في التخزين المحلي:', e);
          }
        }
        
        updateFileInfo('barcode_ready.xlsx', productsData.length);
        loadingMessage.innerHTML = `تم تحميل ${productsData.length} منتج من GitHub بنجاح`;
        setTimeout(() => {
          loadingMessage.style.display = 'none';
        }, 3000);
        isDataLoaded = true;
        
      } catch (error) {
        console.error('حدث خطأ أثناء تحميل ملف Excel من GitHub:', error);
        const loadingMessage = document.getElementById('loading-message');
        if (loadingMessage) {
          loadingMessage.innerHTML = `فشل تحميل البيانات: ${error.message}`;
          loadingMessage.style.backgroundColor = '#f44336';
        }
      }
    }
  </script>
</body>
</html>
